<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Pi Merchant - Dashboard</title>
<style>
body{font-family:Arial;background:#0f0f1a;color:white;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto}
.card{background:#1e1e2e;padding:25px;border-radius:15px;margin-bottom:20px}
h1{color:#f9c74f}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
.btn-yellow{background:#f9c74f;color:black;padding:14px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;font-size:16px}
.btn-purple{background:#7b2ff7;color:white;padding:14px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;font-size:16px;margin-top:10px}
.invoice{background:white;color:black;padding:20px;border-radius:12px;margin-top:20px}
.success{background:#d4edda;color:#155724;padding:15px;border-radius:10px;margin-top:15px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>Welcome, World Pi Merchant 👋</h1>
<p>Manage your Pi payments easily</p>
</div>

<div class="card">
<h2>Create New Invoice</h2>
<input id="customer" placeholder="Customer Name - Ex: Ahmed">
<input id="product" placeholder="Product - Ex: Coffee">
<input id="amount" type="number" placeholder="Amount in Pi - Ex: 10">
<button class="btn-yellow" onclick="createInvoice()">Create Invoice →</button>
</div>

<div id="result"></div>
</div>

<script>
function createInvoice(){
let c=document.getElementById('customer').value;
let p=document.getElementById('product').value;
let a=document.getElementById('amount').value;
if(!c||!p||!a){alert('Please fill all fields');return;}
document.getElementById('result').innerHTML=`
<div class="invoice">
<h3>Invoice - World Pi Merchant</h3>
<p><b>Merchant:</b> World Pi Merchant</p>
<p><b>Customer:</b> ${c}</p>
<p><b>Product:</b> ${p}</p>
<p><b>Amount:</b> ${a} π</p>
<button class="btn-purple" onclick="pay('${a}')">Pay with Pi Wallet</button>
<div id="payResult"></div>
</div>`;
}
function pay(amount){
document.getElementById('payResult').innerHTML=`<div class="success">✅ Payment Successful!<br>Payment of ${amount} π received</div>`;
}
</script>
</body>
</html>
